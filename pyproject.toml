[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghbackup"
version = "0.1.0"
description = "Ejecutable interactivo para respaldo diferencial de carpetas locales a GitHub"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Max Godoy", email = "max.godoy@cjgconsultores.com" },
]
license = { text = "Proprietary" }
dependencies = [
    "PyGithub>=2.1.1",
    "cryptography>=42.0.0",
    "colorama>=0.4.6",
    "questionary>=2.0.1",
    "pathspec>=0.12.1",
    "click>=8.1.7",
]

[project.scripts]
ghbackup = "ghbackup.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
