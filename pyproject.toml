[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghbackup"
version = "0.2.0"
description = "Ejecutable interactivo para respaldo diferencial de carpetas locales a GitHub"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Max Godoy", email = "max.godoy@cjgconsultores.com" },
]
license = { text = "Proprietary" }
dependencies = [
    "PyGithub>=2.1.1",
    "cryptography>=42.0.0",
    "colorama>=0.4.6",
    "questionary>=2.0.1",
    "pathspec>=0.12.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "mypy>=1.10",
    "ruff>=0.4",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
ghbackup = "ghbackup.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ghbackup --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["ghbackup"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["questionary.*", "colorama.*", "pathspec.*", "github.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ghbackup"]
# Excluidos del objetivo 80%: requieren API de GitHub real o prompts interactivos.
# Cubiertos por tests de integracion (pendiente: test_push_e2e.py).
omit = [
    "*/ui/*",
    "*/cli.py",
    "*/__main__.py",
    "*/commands/*",
    "*/github_io/*",
    "*/logging_/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
