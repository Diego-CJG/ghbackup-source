name: Build — ghbackup.exe

on:
  push:
    tags:
      - "v*"          # Dispara en tags tipo v0.2.0, v1.0.0, etc.
  workflow_dispatch:  # También se puede lanzar manualmente desde la UI de GitHub

jobs:
  build-windows:
    name: Compilar .exe en Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe with PyInstaller
        run: pyinstaller --clean build.spec

      - name: Verify .exe runs
        run: dist\ghbackup.exe --version

      - name: Compute SHA-256 of .exe
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\ghbackup.exe -Algorithm SHA256).Hash.ToLower()
          $version = python -c "from ghbackup.version import __version__; print(__version__)"
          "ghbackup-$version.exe  sha256:$hash" | Out-File -FilePath dist\ghbackup.exe.sha256.txt
          cat dist\ghbackup.exe.sha256.txt

      - name: Upload .exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghbackup-exe
          path: |
            dist/ghbackup.exe
            dist/ghbackup.exe.sha256.txt
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ghbackup.exe
            dist/ghbackup.exe.sha256.txt
          generate_release_notes: true
