name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Corre todos los lunes a las 08:00 UTC para detectar nuevas vulnerabilidades
    - cron: "0 8 * * 1"

jobs:
  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit
        run: |
          bandit -r src/ghbackup \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json || true
          bandit -r src/ghbackup \
            --severity-level medium \
            --confidence-level medium

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  pip-audit:
    name: pip-audit (dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          pip install -r requirements.txt
          pip-audit --requirement requirements.txt --format json --output pip-audit-report.json || true
          # PYSEC-2025-183: vulnerabilidad en pyjwt (dep. transitiva de PyGithub).
          # No hay fix disponible en PyPI al momento. Se ignora hasta que PyGithub
          # actualice su dependencia o pyjwt publique un release corregido.
          pip-audit --requirement requirements.txt --ignore-vuln PYSEC-2025-183

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
